<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Viewport is locked (no user zoom) and the body uses touch-action:none so
  swipe gestures drive the snake instead of scrolling / pull-to-refresh.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0722">
<meta name="description" content="Snackbite — a retro arcade snake game">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<title>Snackbite</title>
<style>
  :root {
    --bg-0: #0a0517;
    --bg-1: #160a2e;
    --bg-2: #051422;
    --text: #f4f0ff;
    --muted: #a89fd0;
    --cyan: #22d3ee;
    --green: #4ade80;
    --pink: #ff2e88;
    --amber: #ffb84d;
    --purple: #b9a8ff;
    --cyan-glow: rgba(34, 211, 238, .45);
    --green-glow: rgba(74, 222, 128, .45);
    --pink-glow: rgba(255, 46, 136, .45);
    --panel: rgba(14, 10, 34, .75);
    --panel-border: rgba(34, 211, 238, .40);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;      /* no pull-to-refresh / bounce */
    touch-action: none;             /* swipes never scroll the page */
    background: linear-gradient(160deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
    background-size: 220% 220%;
    animation: bgDrift 26s ease-in-out infinite;
    color: var(--text);
    font-family: 'Orbitron', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* subtle retro grid overlay (magenta + cyan) */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(255, 46, 136, .055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34, 211, 238, .055) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 0;
  }

  /* drifting glow orbs (arcade marquee palette) */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(620px 620px at 12% 16%, rgba(255, 46, 136, .13), transparent 62%),
      radial-gradient(720px 720px at 88% 84%, rgba(34, 211, 238, .12), transparent 62%);
    animation: orbFloat 16s ease-in-out infinite alternate;
  }

  @keyframes bgDrift { 0%, 100% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } }
  @keyframes orbFloat { from { opacity: .55; } to { opacity: 1; } }

  /* ---------- CRT overlay (scanlines + vignette + traveling scan band) ---------- */
  #crt {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    background:
      radial-gradient(ellipse at center, transparent 56%, rgba(0, 0, 0, .42) 100%),
      repeating-linear-gradient(0deg, rgba(0, 0, 0, .17) 0 1px, transparent 1px 3px);
  }

  #crt::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: -140px;
    height: 140px;
    background: linear-gradient(180deg, transparent, rgba(140, 200, 255, .05), transparent);
    animation: crtBand 7s linear infinite;
  }

  @keyframes crtBand { to { transform: translateY(calc(100vh + 280px)); } }

  #app {
    position: relative;
    z-index: 1;
    height: 100vh;                  /* fallback */
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding:
      calc(14px + env(safe-area-inset-top))
      calc(14px + env(safe-area-inset-right))
      calc(14px + env(safe-area-inset-bottom))
      calc(14px + env(safe-area-inset-left));
  }

  /* ---------- HUD ---------- */
  #hud {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 40px;
    flex: 0 0 auto;                 /* never let flex shrink the HUD */
  }

  /* Arcade marquee title */
  #marquee {
    position: relative;
    font-family: 'Press Start 2P', ui-monospace, monospace;
    font-size: clamp(15px, 4.4vw, 32px);
    letter-spacing: .16em;
    padding: 12px 30px;
    border: 3px solid var(--pink);
    border-radius: 6px;
    background: linear-gradient(180deg, rgba(46, 12, 70, .92), rgba(10, 5, 26, .96));
    box-shadow: 0 0 20px var(--pink-glow), inset 0 0 16px rgba(255, 46, 136, .16);
    text-align: center;
    text-indent: .16em;             /* balance letter-spacing */
  }

  #marquee span {
    background: linear-gradient(90deg, var(--pink), var(--amber) 45%, var(--cyan));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 8px rgba(255, 46, 136, .55));
  }

  /* blinking cabinet bulbs */
  #marquee::before,
  #marquee::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 10px;
    height: 10px;
    margin-top: -5px;
    border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 0 10px var(--pink);
    animation: bulbBlink 1.1s steps(1) infinite;
  }

  #marquee::before { left: 8px; }
  #marquee::after { right: 8px; animation-delay: .55s; }

  @keyframes bulbBlink { 50% { opacity: .15; } }

  .stats-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    width: 100%;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 92px;
    padding: 8px 14px;
    border-radius: 4px;
    background: linear-gradient(180deg, rgba(18, 12, 44, .85), rgba(8, 6, 22, .92));
    border: 2px solid var(--panel-border);
    box-shadow: 0 0 12px rgba(34, 211, 238, .18), inset 0 0 10px rgba(34, 211, 238, .05);
    line-height: 1.2;
  }

  .stat .label {
    font-family: 'Press Start 2P', ui-monospace, monospace;
    font-size: 8px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--purple);
  }

  .stat .value {
    font-size: 24px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }

  #score { color: var(--pink); text-shadow: 0 0 14px var(--pink-glow); }
  #highScore { color: var(--green); text-shadow: 0 0 14px var(--green-glow); }

  /* Effect-snack timer pill (⚡ speed boost / 🐌 slow-down) */
  #effectHud {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 96px;
    min-height: 26px;
    padding: 8px 12px;
    border-radius: 3px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--cyan);
    border: 1px solid transparent;
    opacity: 0;
    transition: opacity .2s;
  }

  #effectHud.active {
    opacity: 1;
    border-color: rgba(34, 211, 238, .6);
    background: rgba(34, 211, 238, .08);
    box-shadow: 0 0 18px var(--cyan-glow);
    text-shadow: 0 0 8px var(--cyan-glow);
  }

  /* ---------- Board: arcade monitor bezel ---------- */
  #board-wrap {
    position: relative;
    flex: 0 0 auto;
    margin-top: auto;               /* board is the visual centerpiece: */
    margin-bottom: auto;            /* header pins top, legend pins bottom */
    padding: 10px;
    border-radius: 12px;
    background: linear-gradient(180deg, #0e0a20, #07051a);
    border: 3px solid var(--cyan);
    box-shadow: 0 0 22px rgba(34, 211, 238, .35), inset 0 0 18px rgba(34, 211, 238, .12);
  }

  #game {
    display: block;
    border-radius: 4px;             /* CRT tube corners */
    background: #05070d;
    border: 1px solid rgba(34, 211, 238, .25);
  }

  /* tube-glass sheen across the screen */
  #board-wrap::after {
    content: "";
    position: absolute;
    inset: 10px;
    pointer-events: none;
    border-radius: 4px;
    background: linear-gradient(115deg, rgba(255, 255, 255, .06) 0%, transparent 42%);
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(6, 3, 14, .85);
    border-radius: 12px;
    z-index: 2;
    text-align: center;
    padding: 12px;
  }

  #overlay.hidden { display: none; }

  .card {
    padding: 18px 26px;
    border-radius: 4px;
    background: linear-gradient(180deg, rgba(24, 10, 36, .92), rgba(10, 6, 20, .95));
    border: 3px solid var(--pink);
    box-shadow: 0 0 26px var(--pink-glow);
  }

  .card h1 {
    margin: 0 0 14px;
    font-family: 'Press Start 2P', ui-monospace, monospace;
    font-size: 26px;
    color: #ff2e4d;
    text-shadow: 0 0 16px rgba(255, 46, 90, .8), 0 3px 0 rgba(120, 0, 30, .9);
    animation: gameOverFlicker 2.6s steps(2, start) infinite;
  }

  @keyframes gameOverFlicker {
    0%, 100% { opacity: 1; }
    91% { opacity: 1; }
    92% { opacity: .35; }
    93% { opacity: 1; }
    95% { opacity: .15; }
    96% { opacity: 1; }
  }

  .card .final {
    margin: 6px 0;
    font-size: 20px;
    font-weight: 700;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan-glow);
  }

  .card .best {
    margin: 6px 0;
    font-size: 13px;
    color: var(--muted);
  }

  .card .hint {
    margin-top: 16px;
    font-family: 'Press Start 2P', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--green);
    text-shadow: 0 0 10px var(--green-glow);
    animation: blink 1s steps(2, start) infinite;
  }

  @keyframes blink { to { visibility: hidden; } }

  /* ---------- Legend / footer ---------- */
  #legend {
    flex: 0 0 auto;                 /* never let flex shrink the footer */
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    line-height: 1.9;
  }

  #legend .hl {
    display: inline-block;
    color: var(--text);
    padding: 3px 10px;
    margin: 2px;
    border-radius: 3px;
    border: 1px solid rgba(255, 46, 136, .35);
    background: rgba(20, 10, 40, .55);
  }

  /* ---------- Responsive: phones, tablets, short/landscape ---------- */
  @media (max-width: 480px) {
    #app {
      gap: 8px;
      padding:
        calc(10px + env(safe-area-inset-top))
        calc(10px + env(safe-area-inset-right))
        calc(10px + env(safe-area-inset-bottom))
        calc(10px + env(safe-area-inset-left));
    }
    #marquee { padding: 9px 24px; }
    .stats-row { gap: 12px; }
    .stat { min-width: 78px; padding: 6px 10px; }
    .stat .value { font-size: 19px; }
    #effectHud { min-width: 84px; padding: 6px 8px; }
    #legend { font-size: 11px; }
  }

  /* Short screens (phone landscape etc.) — hide the marquee, keep the board big */
  @media (max-height: 500px) {
    #marquee { display: none; }
    #app { gap: 8px; }
    .stat { padding: 4px 10px; min-width: 74px; }
    .stat .value { font-size: 17px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html, body, body::after { animation: none; }
    #crt::after { animation: none; }
    #marquee::before, #marquee::after { animation: none; }
    .card h1 { animation: none; }
    .card .hint { animation: none; }
    #effectHud { transition: none; }
  }

  /* ---------- Start screen: big play button ---------- */
  #start-screen {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 5, 22, .96);
    cursor: pointer;
  }

  #start-btn {
    font-family: 'Press Start 2P', ui-monospace, monospace;
    font-size: clamp(32px, 9vw, 56px);
    letter-spacing: .12em;
    padding: 28px 56px;
    color: #fff;
    background: linear-gradient(180deg, #ff3d94, #ff2e88);
    border: 6px solid #fff;
    border-radius: 14px;
    cursor: pointer;
    text-shadow: 0 3px 0 rgba(0, 0, 0, .35);
    box-shadow: 0 0 50px rgba(255, 46, 136, .85), 0 12px 0 #7a0f3d, inset 0 -8px 0 rgba(0, 0, 0, .25);
    transition: transform .12s ease;
  }

  #start-btn:hover { transform: scale(1.06); }
  #start-btn:active { transform: scale(.95); }
  #start-btn:focus { outline: 3px solid #fff; outline-offset: 6px; }
</style>
</head>
<body>
  <div id="crt" aria-hidden="true"></div>

  <div id="start-screen">
    <button id="start-btn">PLAY</button>
  </div>

  <div id="app">
    <header id="hud">
      <div id="marquee"><span>SNACKBITE</span></div>
      <div class="stats-row">
        <div class="stat">
          <span class="label">Score</span>
          <span class="value" id="score">0</span>
        </div>
        <div id="effectHud" role="status"></div>
        <div class="stat">
          <span class="label">Best</span>
          <span class="value" id="highScore">0</span>
        </div>
      </div>
    </header>

    <div id="board-wrap">
      <canvas id="game"></canvas>
      <div id="overlay" class="hidden">
        <div class="card">
          <h1>GAME OVER</h1>
          <p class="final" id="finalScore"></p>
          <p class="best" id="finalBest"></p>
          <p class="hint" id="restartHint"></p>
        </div>
      </div>
    </div>

    <footer id="legend">
      <span class="hl">🍎 10</span> <span class="hl">🍒 25</span> <span class="hl">⭐ 50</span> <span class="hl">⚡ speed</span> <span class="hl">🐌 slow</span><br>
      <span class="hl">←↑→↓ / WASD</span> <span class="hl">swipe on touch</span>
    </footer>
  </div>

  <script src="kaplay.js"></script>
  <script src="game.js"></script>
</body>
</html>
