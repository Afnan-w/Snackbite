<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  Viewport is locked (no user zoom) and the body uses touch-action:none so
  swipe gestures drive the snake instead of scrolling / pull-to-refresh.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1026">
<meta name="description" content="Snackbite — a neon snake arcade game">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<title>Snackbite</title>
<style>
  :root {
    --bg-0: #070b1a;
    --bg-1: #0b1730;
    --bg-2: #170c2b;
    --text: #eaf6ff;
    --muted: #9fb3c8;
    --cyan: #22d3ee;
    --green: #4ade80;
    --cyan-glow: rgba(34, 211, 238, .45);
    --green-glow: rgba(74, 222, 128, .45);
    --panel: rgba(10, 18, 40, .55);
    --panel-border: rgba(34, 211, 238, .35);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;      /* no pull-to-refresh / bounce */
    touch-action: none;             /* swipes never scroll the page */
    background: linear-gradient(160deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
    background-size: 220% 220%;
    animation: bgDrift 26s ease-in-out infinite;
    color: var(--text);
    font-family: 'Orbitron', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* subtle neon grid overlay */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(34, 211, 238, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34, 211, 238, .045) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
    z-index: 0;
  }

  /* drifting glow orbs */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(620px 620px at 12% 16%, rgba(34, 211, 238, .14), transparent 62%),
      radial-gradient(720px 720px at 88% 84%, rgba(74, 222, 128, .13), transparent 62%);
    animation: orbFloat 16s ease-in-out infinite alternate;
  }

  @keyframes bgDrift { 0%, 100% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } }
  @keyframes orbFloat { from { opacity: .55; } to { opacity: 1; } }

  #app {
    position: relative;
    z-index: 1;
    height: 100vh;                  /* fallback */
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding:
      calc(14px + env(safe-area-inset-top))
      calc(14px + env(safe-area-inset-right))
      calc(14px + env(safe-area-inset-bottom))
      calc(14px + env(safe-area-inset-left));
  }

  /* ---------- HUD ---------- */
  #hud {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 40px;
  }

  .stats-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    width: 100%;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 92px;
    padding: 8px 16px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    box-shadow: 0 0 14px rgba(34, 211, 238, .15), inset 0 0 12px rgba(34, 211, 238, .06);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    line-height: 1.2;
  }

  .stat .label {
    font-size: 9px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }

  .stat .value {
    font-size: 24px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }

  #score { color: var(--cyan); text-shadow: 0 0 14px var(--cyan-glow); }
  #highScore { color: var(--green); text-shadow: 0 0 14px var(--green-glow); }

  /* Effect-snack timer pill (⚡ speed boost / 🐌 slow-down) */
  #effectHud {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 96px;
    min-height: 26px;
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--cyan);
    border: 1px solid transparent;
    opacity: 0;
    transition: opacity .2s;
  }

  #effectHud.active {
    opacity: 1;
    border-color: rgba(34, 211, 238, .6);
    background: rgba(34, 211, 238, .08);
    box-shadow: 0 0 18px var(--cyan-glow);
    text-shadow: 0 0 8px var(--cyan-glow);
  }

  /* ---------- Board + overlays ---------- */
  #board-wrap {
    position: relative;
    flex: 0 0 auto;
  }

  #game {
    display: block;
    border-radius: 14px;
    background: #0b1018;
    border: 2px solid rgba(34, 211, 238, .55);
    box-shadow:
      0 0 22px rgba(34, 211, 238, .30),
      0 0 64px rgba(74, 222, 128, .16),
      0 14px 40px rgba(0, 0, 0, .5);
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(4, 8, 18, .82);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    border-radius: 14px;
    z-index: 2;
    text-align: center;
    padding: 12px;
  }

  #overlay.hidden { display: none; }

  .card {
    padding: 20px 28px;
    border-radius: 16px;
    background: linear-gradient(160deg, rgba(12, 20, 44, .88), rgba(8, 14, 30, .92));
    border: 1px solid rgba(34, 211, 238, .45);
    box-shadow: 0 0 30px rgba(34, 211, 238, .30);
  }

  .card h1 {
    margin: 0 0 14px;
    font-family: 'Press Start 2P', 'Orbitron', ui-monospace, monospace;
    font-size: 22px;
    color: #ff4d5e;
    text-shadow: 0 0 16px rgba(255, 77, 94, .6);
  }

  .card .final {
    margin: 6px 0;
    font-size: 20px;
    font-weight: 700;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan-glow);
  }

  .card .best {
    margin: 6px 0;
    font-size: 13px;
    color: var(--muted);
  }

  .card .hint {
    margin-top: 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 10px var(--green-glow);
    animation: blink 1.4s steps(2, start) infinite;
  }

  @keyframes blink { to { visibility: hidden; } }

  /* ---------- Legend / footer ---------- */
  #legend {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    line-height: 1.9;
  }

  #legend .hl {
    display: inline-block;
    color: var(--text);
    padding: 3px 10px;
    margin: 2px;
    border-radius: 999px;
    border: 1px solid rgba(34, 211, 238, .25);
    background: rgba(10, 18, 40, .45);
  }

  /* ---------- Responsive: phones, tablets, short/landscape ---------- */
  @media (max-width: 480px) {
    #app {
      gap: 8px;
      padding:
        calc(10px + env(safe-area-inset-top))
        calc(10px + env(safe-area-inset-right))
        calc(10px + env(safe-area-inset-bottom))
        calc(10px + env(safe-area-inset-left));
    }
    .stats-row { gap: 12px; }
    .stat { min-width: 78px; padding: 6px 10px; }
    .stat .value { font-size: 19px; }
    #effectHud { min-width: 84px; padding: 6px 8px; }
    #legend { font-size: 11px; }
  }

  /* Short screens (phone landscape etc.) — keep the board big */
  @media (max-height: 500px) {
    #app { gap: 8px; }
    .stat { padding: 4px 10px; min-width: 74px; }
    .stat .value { font-size: 17px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html, body, body::after { animation: none; }
    .card .hint { animation: none; }
    #effectHud { transition: none; }
  }
</style>
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="stats-row">
        <div class="stat">
          <span class="label">Score</span>
          <span class="value" id="score">0</span>
        </div>
        <div id="effectHud" role="status"></div>
        <div class="stat">
          <span class="label">Best</span>
          <span class="value" id="highScore">0</span>
        </div>
      </div>
    </header>

    <div id="board-wrap">
      <canvas id="game"></canvas>
      <div id="overlay" class="hidden">
        <div class="card">
          <h1>GAME OVER</h1>
          <p class="final" id="finalScore"></p>
          <p class="best" id="finalBest"></p>
          <p class="hint" id="restartHint"></p>
        </div>
      </div>
    </div>

    <footer id="legend">
      <span class="hl">🍎 10</span> <span class="hl">🍒 25</span> <span class="hl">⭐ 50</span> <span class="hl">⚡ speed</span> <span class="hl">🐌 slow</span><br>
      <span class="hl">←↑→↓ / WASD</span> <span class="hl">swipe on touch</span>
    </footer>
  </div>

  <script src="kaplay.js"></script>
  <script src="game.js"></script>
</body>
</html>
